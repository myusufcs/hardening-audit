name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile check
        run: python3 -m compileall -q hardening_audit

      - name: Jalankan test
        run: python3 -m unittest discover -s tests -v

      - name: Audit di runner (smoke test, exit code 0/1 saja)
        run: |
          python3 -m hardening_audit --out reports --format md,json || true
          ls -la reports
          python3 -m hardening_audit --only ssh --format json | head -20
